server:
  port: 8888
spring:
  application:
    name: backend-config-server
  profiles:
    active: native,vault
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
        vault:
          kv-version: 2
          profile-separator: /
          authentication: token
          host: ${VAULT_HOST:127.0.0.1}
          port: ${VAULT_PORT:8200}
          token: ${VAULT_TOKEN:dev-only-vault-token}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: info
---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.springframework.cloud.config: debug
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: warn
    org.springframework.cloud.config: info
