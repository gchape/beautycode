services:
  vault:
    image: hashicorp/vault
    container_name: beauty-code-vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status" ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10

  backend-config-server:
    build:
      context: ./backend-config-server
    container_name: beauty-code-config-server
    expose:
      - "8888"
    environment:
      - VAULT_HOST=vault
      - VAULT_PORT=8200
    depends_on:
      vault-seed:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 5s
      timeout: 3s
      start_period: 60s
      start_interval: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
    container_name: beauty-code-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - CONFIG_SERVER_URI=http://backend-config-server:8888
      - VAULT_TOKEN=${VAULT_TOKEN}
      - AWS_REGION=eu-central-1
      - AWS_DYNAMODB_TABLE_NAME=BeautyCode
    depends_on:
      backend-config-server:
        condition: service_healthy
    restart: unless-stopped