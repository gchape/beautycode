services:
  vault:
    image: hashicorp/vault
    container_name: beauty-code-vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8200/v1/sys/health?standbyok=true"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  backend-config-server:
    build:
      context: ./backend-config-server
    container_name: beauty-code-config-server
    expose:
      - "8888"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - VAULT_HOST=vault
      - VAULT_PORT=8200
    depends_on:
      vault:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  backend:
    build:
      context: .
    container_name: beauty-code-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - AWS_REGION=eu-central-1
      - AWS_DYNAMODB_TABLE_NAME=BeautyCode
      - SPRING_PROFILES_ACTIVE=prod
      - CONFIG_SERVER_URI=http://backend-config-server:8888
      - VAULT_TOKEN=${VAULT_TOKEN}
    depends_on:
      backend-config-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5