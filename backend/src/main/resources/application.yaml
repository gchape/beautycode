server:
  port: 8080
spring:
  application:
    name: backend
  profiles:
    active: dev
  config:
    import: "configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  task:
    execution:
      thread-name-prefix: newsletter-async-
      simple:
        concurrency-limit: 100
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
