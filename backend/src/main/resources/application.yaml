spring:
  application:
    name: backend
  profiles:
    default: dev
ldap:
  users:
    search-base: ou=users
    search-filter: (mail={0})
  admins:
    search-base: ou=admins
    search-filter: (mail={0})
  group-search-base: ou=groups
  group-search-filter: (member={0})
---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    aws:
      region:
        static: eu-central-1
      credentials:
        instance-profile: false
      dynamodb:
        table-name: BeautyCode
  ldap:
    urls: ldap://localhost:389
    base: dc=beautycode,dc=live
    username: cn=admin,dc=beautycode,dc=live
    password: admin
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-please-1234567890}
      expiration-seconds: 21600

logging:
  level:
    root: info
---
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    aws:
      region:
        static: ${AWS_REGION}
      dynamodb:
        table-name: ${AWS_DYNAMODB_TABLE_NAME}
  ldap:
    urls: ${LDAP_URLS}
    base: ${LDAP_BASE}
    username: ${LDAP_ADMIN_DN}
    password: ${LDAP_ADMIN_PASSWORD}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:21600}

logging:
  level:
    root: error