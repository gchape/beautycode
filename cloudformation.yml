AWSTemplateFormatVersion: '2010-09-09'
Description: Beauty Code application host (EC2) with S3 backups for the SQLite database and product images
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC for the application host
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in VpcId with a route to an internet gateway
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 x86_64 AMI parameter
  RootVolumeSize:
    Type: Number
    Default: 30
    MinValue: 30
    MaxValue: 1024
Resources:
  Backups:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: beautycode-ge-backups
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          # Database snapshots expire after 30 days. Product images under uploads/ never expire.
          - Id: ExpireOldBackups
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
  BackupsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Backups
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Backups.Arn, !Sub '${Backups.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: BackupStorage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Database snapshots (written by the app) and image sync (written by the host script).
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource:
                  - !Sub '${Backups.Arn}/backups/*'
                  - !Sub '${Backups.Arn}/uploads/*'
              # Listing is limited to uploads/ so aws s3 sync can compare and restore images.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Backups.Arn
                Condition:
                  StringLike:
                    's3:prefix': ['uploads/*']
  AppProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref AppRole] }
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and HTTPS; administration through Session Manager
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref AppProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref AppSecurityGroup]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            DeleteOnTermination: false
      # A 2 GiB swap file keeps Docker image builds from being killed on small instances.
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eu
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile
            mkswap /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          swapon -a
          echo 'vm.swappiness=10' > /etc/sysctl.d/99-swappiness.conf
          sysctl -w vm.swappiness=10
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-app'
  AppAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  AppAddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt AppAddress.AllocationId
      InstanceId: !Ref AppInstance
Outputs:
  InstanceId: { Value: !Ref AppInstance }
  PublicIp: { Value: !Ref AppAddress }
  BackupsBucket: { Value: !Ref Backups }
  InstanceProfile: { Value: !Ref AppProfile }
