AWSTemplateFormatVersion: '2010-09-09'
Description: Beauty Code private images, CloudFront, SQLite backups, and EC2 application host
Parameters:
  SiteOrigin:
    Type: String
    Default: https://beautycode.ge
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
    Description: Exact HTTPS website origin without trailing slash
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC for the application host
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in VpcId with a route to an internet gateway
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 x86_64 AMI parameter
  RootVolumeSize:
    Type: Number
    Default: 30
    MinValue: 30
    MaxValue: 1024
Resources:
  Images:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: beautycode-ge-images
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref SiteOrigin]
            AllowedMethods: [POST, GET, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 300
  Backups:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: beautycode-ge-backups
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldBackups
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
  ImageOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-images'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ImageDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: images
            DomainName: !GetAtt Images.RegionalDomainName
            OriginAccessControlId: !GetAtt ImageOriginAccess.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: images
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues: { QueryString: false }
          DefaultTTL: 86400
          MaxTTL: 31536000
          MinTTL: 0
        ViewerCertificate: { CloudFrontDefaultCertificate: true }
  ImagesPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Images
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${Images.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImageDistribution}'
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Images.Arn, !Sub '${Images.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }
  BackupsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Backups
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Backups.Arn, !Sub '${Backups.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: CatalogStorage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub '${Images.Arn}/products/*'
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${Backups.Arn}/backups/*'
  AppProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref AppRole] }
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and HTTPS; administration through Session Manager
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref AppProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref AppSecurityGroup]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            DeleteOnTermination: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-app'
  AppAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  AppAddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt AppAddress.AllocationId
      InstanceId: !Ref AppInstance
Outputs:
  InstanceId: { Value: !Ref AppInstance }
  PublicIp: { Value: !Ref AppAddress }
  ImagesBucket: { Value: !Ref Images }
  BackupsBucket: { Value: !Ref Backups }
  ImagesBaseUrl: { Value: !Sub 'https://${ImageDistribution.DomainName}' }
  InstanceProfile: { Value: !Ref AppProfile }
