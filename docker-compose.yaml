services:
  app:
    build:
      context: .
      args:
        SITE_URL: https://${DOMAIN:?Set DOMAIN in .env}
        VITE_CRISP_WEBSITE_ID: ${VITE_CRISP_WEBSITE_ID:?Set VITE_CRISP_WEBSITE_ID in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      SITE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      DB_PATH: /data/beautycode.db
      UPLOADS_DIR: /data/uploads
      MIGRATIONS_DIR: /app/migrations
    volumes:
      - ./data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      # Only substitute DOMAIN; leave nginx's own $host and $request_uri untouched.
      NGINX_ENVSUBST_FILTER: ^DOMAIN$$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./secrets/htpasswd:/etc/nginx/htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html
      - ./data/uploads:/srv/uploads:ro
